<radialGradient id="glow"><stop stop-color="#ff3b30" stop-opacity=".9"/><stop offset="1" stop-color="#ff3b30" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
