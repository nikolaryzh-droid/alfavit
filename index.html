<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>РПК Алфавит</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: #fff;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 30px 6%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .hero-content {
            margin: auto 0;
            max-width: 1000px;
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 25px;
            opacity: .7;
        }

        h1 {
            font-size: clamp(48px, 8vw, 110px);
            line-height: .92;
            text-transform: uppercase;
        }

        .description {
            margin-top: 30px;
            max-width: 650px;
            font-size: 20px;
            line-height: 1.5;
            opacity: .8;
        }

        .button {
            display: inline-block;
            margin-top: 35px;
            padding: 18px 30px;
            background: #fff;
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<section class="hero">

    <nav>
        <div class="logo">АЛФАВИТ</div>
        <div>РПК</div>
    </nav>

    <div class="hero-content">

        <div class="subtitle">
            РЕКЛАМНО-ПРОИЗВОДСТВЕННАЯ КОМПАНИЯ
        </div>

        <h1>
            Создаём<br>
            рекламу,<br>
            которую замечают
        </h1>

        <p class="description">
            Наружная реклама, вывески, объёмные буквы,
            оформление фасадов, полиграфия и рекламные конструкции.
        </p>

        <a href="#" class="button">
            РАССЧИТАТЬ СТОИМОСТЬ
        </a>

    </div>

</section>

</body>
</html>
